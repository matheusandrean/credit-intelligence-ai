name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (black)
        run: black --check .

      - name: Type check (mypy)
        run: mypy src api || true # non-blocking during early-stage typing rollout

      - name: Secret scan (detect-secrets)
        run: |
          detect-secrets scan --all-files > /tmp/secrets-scan.json
          python -c "
          import json
          with open('/tmp/secrets-scan.json') as f:
              data = json.load(f)
          leaks = {k: v for k, v in data.get('results', {}).items() if v}
          if leaks:
              print('Potential secrets detected:', leaks)
              raise SystemExit(1)
          print('No secrets detected.')
          "

      - name: Dependency vulnerability scan (pip-audit)
        run: pip-audit --skip-editable || true # advisory, non-blocking

      - name: Generate synthetic dataset (small sample for CI)
        run: |
          python -c "
          from src.data.generate_synthetic_credit_data import GenerationConfig, generate_customer_snapshot
          cfg = GenerationConfig(n_customers=2000, random_seed=42, start_date='2023-01-01', end_date='2025-06-30')
          df = generate_customer_snapshot(cfg)
          print(df.shape)
          "

      - name: Run tests with coverage
        run: pytest --cov=src --cov=api --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: api
          push: false
          tags: credit-intelligence-ai:api-ci
